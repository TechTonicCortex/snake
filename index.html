<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: #0a0f1a;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  font-family: 'Orbitron', monospace;
  color: #e0f0ff;
  overflow: hidden;
}

/* Grid background */
body::before {
  content: '';
  position: fixed; inset: 0;
  background-image:
    linear-gradient(rgba(79,195,247,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(79,195,247,0.03) 1px, transparent 1px);
  background-size: 20px 20px;
  pointer-events: none;
}

.wrap {
  display: flex;
  gap: 20px;
  align-items: flex-start;
  position: relative;
  z-index: 1;
}

/* GAME CANVAS AREA */
.game-area {
  position: relative;
}

canvas {
  display: block;
  border: 1px solid rgba(79,195,247,0.2);
  border-radius: 8px;
  box-shadow: 0 0 40px rgba(79,195,247,0.08);
}

/* OVERLAY SCREENS */
.overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  background: rgba(5,8,18,0.92);
  border-radius: 8px;
  backdrop-filter: blur(6px);
}

.overlay.hidden { display: none; }

.big-title {
  font-size: 52px;
  font-weight: 900;
  color: #4fc3f7;
  letter-spacing: 4px;
  text-shadow: 0 0 30px rgba(79,195,247,0.5);
}

.sub { font-size: 11px; color: rgba(79,195,247,0.5); letter-spacing: 3px; }
.score-big { font-size: 36px; font-weight: 700; color: #ffd54f; letter-spacing: 2px; }
.score-sub { font-size: 11px; color: rgba(255,255,255,0.3); letter-spacing: 2px; }

.play-btn {
  margin-top: 6px;
  background: none;
  border: 2px solid #4fc3f7;
  border-radius: 4px;
  padding: 12px 32px;
  font-family: 'Orbitron', monospace;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 3px;
  color: #4fc3f7;
  cursor: pointer;
  transition: all 0.2s;
}
.play-btn:hover { background: rgba(79,195,247,0.1); box-shadow: 0 0 20px rgba(79,195,247,0.3); }
.play-btn.red { border-color: #ff5252; color: #ff5252; }
.play-btn.red:hover { background: rgba(255,82,82,0.1); }

.hint { font-size: 10px; color: rgba(255,255,255,0.2); letter-spacing: 1px; text-align: center; line-height: 2.2; }

/* SIDEBAR */
.sidebar {
  display: flex;
  flex-direction: column;
  gap: 14px;
  width: 180px;
}

.side-card {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(79,195,247,0.12);
  border-radius: 10px;
  padding: 14px;
}

.side-label {
  font-size: 8px;
  letter-spacing: 3px;
  color: rgba(79,195,247,0.5);
  margin-bottom: 6px;
  text-transform: uppercase;
}

.side-val {
  font-size: 28px;
  font-weight: 900;
  color: #4fc3f7;
}

.side-val.gold { color: #ffd54f; }

/* Level bar */
.level-bar-wrap {
  margin-top: 8px;
  height: 4px;
  background: rgba(255,255,255,0.08);
  border-radius: 2px;
  overflow: hidden;
}

.level-bar {
  height: 100%;
  background: linear-gradient(90deg, #4fc3f7, #81d4fa);
  border-radius: 2px;
  transition: width 0.3s ease;
}

/* Power-up display */
.pu-list { display: flex; flex-direction: column; gap: 7px; margin-top: 4px; }
.pu-row {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 10px;
  color: rgba(255,255,255,0.3);
  letter-spacing: 1px;
  transition: color 0.2s;
}
.pu-row.active { color: #fff; }
.pu-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: rgba(255,255,255,0.1);
  transition: all 0.2s;
  flex-shrink: 0;
}
.pu-row.active .pu-dot { box-shadow: 0 0 8px currentColor; }

/* Leaderboard */
.lb-list { margin-top: 6px; display: flex; flex-direction: column; gap: 5px; }
.lb-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 10px;
  padding: 4px 0;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}
.lb-row:last-child { border: none; }
.lb-rank { color: rgba(255,255,255,0.3); width: 16px; }
.lb-name { color: rgba(255,255,255,0.6); flex: 1; padding: 0 6px; }
.lb-score { color: #ffd54f; font-weight: 700; }
.lb-row.you .lb-name { color: #4fc3f7; }
.lb-row.you .lb-rank { color: #4fc3f7; }

/* Flash text */
#flash {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  font-size: 22px;
  font-weight: 900;
  color: #ffd54f;
  letter-spacing: 3px;
  opacity: 0;
  pointer-events: none;
  text-shadow: 0 0 20px rgba(255,213,79,0.6);
  transition: opacity 0.2s;
  white-space: nowrap;
}
</style>
</head>
<body>

<div class="wrap">
  <!-- GAME -->
  <div class="game-area">
    <canvas id="c"></canvas>
    <div id="flash"></div>

    <!-- Start screen -->
    <div class="overlay" id="oStart">
      <div class="big-title">SNAKE</div>
      <div class="sub">CLASSIC REIMAGINED</div>
      <button class="play-btn" id="btnPlay">PLAY →</button>
      <div class="hint">
        WASD / ARROW KEYS — Move<br>
        Eat food to grow · Avoid walls & yourself<br>
        Collect power-ups for bonuses
      </div>
    </div>

    <!-- Game over screen -->
    <div class="overlay hidden" id="oOver">
      <div class="big-title" style="font-size:36px;color:#ff5252">GAME OVER</div>
      <div class="score-big" id="goScore"></div>
      <div class="score-sub" id="goLevel"></div>
      <div class="score-sub" id="goHigh"></div>
      <button class="play-btn red" id="btnRetry">RETRY →</button>
    </div>
  </div>

  <!-- SIDEBAR -->
  <div class="sidebar">

    <div class="side-card">
      <div class="side-label">Score</div>
      <div class="side-val gold" id="sScore">0</div>
    </div>

    <div class="side-card">
      <div class="side-label">High Score</div>
      <div class="side-val gold" id="sHigh">0</div>
    </div>

    <div class="side-card">
      <div class="side-label">Level</div>
      <div class="side-val" id="sLevel">1</div>
      <div class="level-bar-wrap">
        <div class="level-bar" id="levelBar" style="width:0%"></div>
      </div>
    </div>

    <div class="side-card">
      <div class="side-label">Power-Ups</div>
      <div class="pu-list">
        <div class="pu-row" id="puSpeed">
          <div class="pu-dot" style="background:#ff9800;color:#ff9800"></div>
          ⚡ SPEED BOOST
        </div>
        <div class="pu-row" id="puSlow">
          <div class="pu-dot" style="background:#4fc3f7;color:#4fc3f7"></div>
          🧊 SLOW DOWN
        </div>
        <div class="pu-row" id="puDouble">
          <div class="pu-dot" style="background:#ce93d8;color:#ce93d8"></div>
          ×2 DOUBLE PTS
        </div>
        <div class="pu-row" id="puGhost">
          <div class="pu-dot" style="background:#80cbc4;color:#80cbc4"></div>
          👻 GHOST MODE
        </div>
      </div>
    </div>

    <div class="side-card">
      <div class="side-label">Leaderboard</div>
      <div class="lb-list" id="lbList"></div>
    </div>

  </div>
</div>

<script>
// ── CANVAS SETUP ─────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const CELL = 20;
const COLS = 25;
const ROWS = 25;
canvas.width  = COLS * CELL;
canvas.height = ROWS * CELL;

// ── CONSTANTS ────────────────────────────────────────────────────
const DIRS = {
  ArrowUp:    {x:0,y:-1}, KeyW:{x:0,y:-1},
  ArrowDown:  {x:0,y:1},  KeyS:{x:0,y:1},
  ArrowLeft:  {x:-1,y:0}, KeyA:{x:-1,y:0},
  ArrowRight: {x:1,y:0},  KeyD:{x:1,y:0},
};

const PU_TYPES = [
  { type:'speed',  col:'#ff9800', emoji:'⚡', label:'SPEED!',   duration:150 },
  { type:'slow',   col:'#4fc3f7', emoji:'🧊', label:'SLOW',     duration:200 },
  { type:'double', col:'#ce93d8', emoji:'×2', label:'DOUBLE!',  duration:300 },
  { type:'ghost',  col:'#80cbc4', emoji:'👻', label:'GHOST!',   duration:200 },
];

// ── STATE ────────────────────────────────────────────────────────
let snake, dir, nextDir, food, powerup;
let score, highScore, level, foodEaten, running;
let puType, puTimer, frameCount, gameLoop;
let particles = [];
const keys = {};

// Load high score
highScore = parseInt(localStorage.getItem('snakeHigh')||'0');
document.getElementById('sHigh').textContent = highScore;

// Leaderboard (stored locally)
let leaderboard = JSON.parse(localStorage.getItem('snakeLB')||'[]');
renderLB();

// ── HELPERS ──────────────────────────────────────────────────────
function rndCell() {
  return { x: Math.floor(Math.random()*COLS), y: Math.floor(Math.random()*ROWS) };
}

function cellFree(pos) {
  return !snake.some(s => s.x===pos.x && s.y===pos.y) &&
         !(food && food.x===pos.x && food.y===pos.y);
}

function freeCell() {
  let pos;
  do { pos = rndCell(); } while (!cellFree(pos));
  return pos;
}

function flash(txt, col) {
  const el = document.getElementById('flash');
  el.textContent = txt;
  el.style.color = col || '#ffd54f';
  el.style.opacity = '1';
  setTimeout(() => el.style.opacity = '0', 900);
}

// ── PARTICLES ────────────────────────────────────────────────────
function burst(x, y, col, n) {
  for (let i=0; i<n; i++) {
    const a = Math.random() * Math.PI * 2;
    const spd = 1 + Math.random() * 3;
    particles.push({
      x: x*CELL+CELL/2, y: y*CELL+CELL/2,
      vx: Math.cos(a)*spd, vy: Math.sin(a)*spd,
      life: 20+Math.random()*20, maxLife: 40,
      r: 1.5+Math.random()*2, col
    });
  }
}

// ── FOOD ─────────────────────────────────────────────────────────
function placeFood() {
  food = freeCell();
  food.pulse = 0;
}

// ── POWER-UPS ────────────────────────────────────────────────────
function placePU() {
  if (powerup) return;
  if (Math.random() > 0.3) return; // 30% chance after eating
  const def = PU_TYPES[Math.floor(Math.random()*PU_TYPES.length)];
  powerup = { ...freeCell(), ...def, blink: 0 };
}

function activatePU(def) {
  puType = def.type;
  puTimer = def.duration;
  flash(def.label, def.col);
  updatePUDisplay();
}

function updatePUDisplay() {
  ['speed','slow','double','ghost'].forEach(t => {
    document.getElementById('pu'+t.charAt(0).toUpperCase()+t.slice(1))
      .classList.toggle('active', puType===t && puTimer>0);
  });
}

// ── GAME SPEED ────────────────────────────────────────────────────
function getInterval() {
  let base = Math.max(80, 180 - level*12); // faster each level
  if (puType==='speed' && puTimer>0) base = Math.max(50, base*0.55);
  if (puType==='slow'  && puTimer>0) base = base * 1.7;
  return base;
}

// ── LEVEL ────────────────────────────────────────────────────────
function foodForLevel() { return 5 + level * 2; } // food needed to level up

function updateLevelBar() {
  const needed = foodForLevel();
  const pct = Math.min((foodEaten / needed) * 100, 100);
  document.getElementById('levelBar').style.width = pct + '%';
}

// ── START GAME ────────────────────────────────────────────────────
function startGame() {
  document.getElementById('oStart').classList.add('hidden');
  document.getElementById('oOver').classList.add('hidden');

  // Init snake in centre
  snake = [
    {x:12, y:12},
    {x:11, y:12},
    {x:10, y:12},
  ];
  dir = {x:1, y:0};
  nextDir = {x:1, y:0};
  particles = [];
  score = 0; level = 1; foodEaten = 0;
  puType = null; puTimer = 0; frameCount = 0;
  food = null; powerup = null;

  placeFood();
  running = true;

  updateSidebar();
  updatePUDisplay();

  if (gameLoop) clearInterval(gameLoop);
  gameLoop = setInterval(tick, getInterval());
  requestAnimationFrame(drawLoop);
}

document.getElementById('btnPlay').onclick  = startGame;
document.getElementById('btnRetry').onclick = startGame;

// ── TICK (game logic) ─────────────────────────────────────────────
function tick() {
  if (!running) return;

  dir = nextDir;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  // Wall collision
  const isGhost = puType==='ghost' && puTimer>0;
  if (!isGhost) {
    if (head.x<0||head.x>=COLS||head.y<0||head.y>=ROWS) { endGame(); return; }
    // Self collision
    if (snake.some(s=>s.x===head.x&&s.y===head.y)) { endGame(); return; }
  } else {
    // Ghost — wrap through walls
    head.x = (head.x+COLS)%COLS;
    head.y = (head.y+ROWS)%ROWS;
  }

  snake.unshift(head);

  // Eat food
  if (head.x===food.x && head.y===food.y) {
    const pts = (puType==='double'&&puTimer>0) ? 20*level : 10*level;
    score += pts;
    foodEaten++;
    burst(food.x, food.y, '#ffd54f', 12);
    flash('+'+pts, puType==='double'?'#ce93d8':'#ffd54f');
    placePU();
    placeFood();

    // Level up
    if (foodEaten >= foodForLevel()) {
      level++;
      foodEaten = 0;
      flash('LEVEL '+level+' !!', '#4fc3f7');
      burst(head.x, head.y, '#4fc3f7', 20);
      clearInterval(gameLoop);
      gameLoop = setInterval(tick, getInterval());
    }
  } else {
    snake.pop(); // no growth
  }

  // Collect power-up
  if (powerup && head.x===powerup.x && head.y===powerup.y) {
    burst(powerup.x, powerup.y, powerup.col, 16);
    activatePU(powerup);
    powerup = null;
  }

  // Power-up timer
  if (puTimer>0) {
    puTimer--;
    if (puTimer===0) { puType=null; updatePUDisplay(); }
    // Refresh interval if speed/slow
    if (puTimer===1) { clearInterval(gameLoop); gameLoop=setInterval(tick,getInterval()); }
  }

  updateSidebar();
  updateLevelBar();
}

// ── END GAME ─────────────────────────────────────────────────────
function endGame() {
  running = false;
  clearInterval(gameLoop);

  // Explode snake head
  burst(snake[0].x, snake[0].y, '#ff5252', 25);

  if (score > highScore) {
    highScore = score;
    localStorage.setItem('snakeHigh', highScore);
    flash('NEW HIGH SCORE!', '#ffd54f');
  }

  // Update leaderboard
  leaderboard.push({ score, level, date: new Date().toLocaleDateString() });
  leaderboard.sort((a,b)=>b.score-a.score);
  leaderboard = leaderboard.slice(0,8);
  localStorage.setItem('snakeLB', JSON.stringify(leaderboard));
  renderLB();

  setTimeout(() => {
    document.getElementById('goScore').textContent = 'SCORE: '+score;
    document.getElementById('goLevel').textContent = 'LEVEL '+level+' · LENGTH '+snake.length;
    document.getElementById('goHigh').textContent  = 'BEST: '+highScore;
    document.getElementById('oOver').classList.remove('hidden');
  }, 600);
}

// ── SIDEBAR ───────────────────────────────────────────────────────
function updateSidebar() {
  document.getElementById('sScore').textContent = score;
  document.getElementById('sHigh').textContent  = Math.max(score, highScore);
  document.getElementById('sLevel').textContent = level;
}

// ── LEADERBOARD ───────────────────────────────────────────────────
function renderLB() {
  const el = document.getElementById('lbList');
  if (!leaderboard.length) { el.innerHTML='<div style="font-size:10px;color:rgba(255,255,255,0.2)">No scores yet</div>'; return; }
  el.innerHTML = leaderboard.slice(0,5).map((e,i)=>`
    <div class="lb-row ${i===0?'you':''}">
      <span class="lb-rank">#${i+1}</span>
      <span class="lb-name">${e.date}</span>
      <span class="lb-score">${e.score}</span>
    </div>`).join('');
}

// ── DRAW LOOP ─────────────────────────────────────────────────────
function drawLoop() {
  draw();
  requestAnimationFrame(drawLoop);
}

function draw() {
  // Background
  ctx.fillStyle = '#080d18';
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // Grid
  ctx.strokeStyle = 'rgba(79,195,247,0.04)';
  ctx.lineWidth = 0.5;
  for (let x=0; x<=COLS; x++) { ctx.beginPath(); ctx.moveTo(x*CELL,0); ctx.lineTo(x*CELL,canvas.height); ctx.stroke(); }
  for (let y=0; y<=ROWS; y++) { ctx.beginPath(); ctx.moveTo(0,y*CELL); ctx.lineTo(canvas.width,y*CELL); ctx.stroke(); }

  // Particles
  particles.forEach((p,i) => {
    p.x+=p.vx; p.y+=p.vy; p.vx*=0.92; p.vy*=0.92; p.life--;
    const a = p.life/p.maxLife;
    ctx.beginPath();
    ctx.arc(p.x, p.y, Math.max(0, p.r*a), 0, Math.PI*2);
    ctx.fillStyle = p.col+(Math.floor(a*255).toString(16).padStart(2,'0'));
    ctx.fill();
  });
  particles = particles.filter(p=>p.life>0);

  // Food
  if (food) {
    food.pulse = (food.pulse||0) + 0.1;
    const sz = CELL*0.42 + Math.sin(food.pulse)*2;
    const grd = ctx.createRadialGradient(food.x*CELL+CELL/2, food.y*CELL+CELL/2, 0, food.x*CELL+CELL/2, food.y*CELL+CELL/2, sz*2);
    grd.addColorStop(0, 'rgba(255,213,79,0.3)');
    grd.addColorStop(1, 'rgba(255,213,79,0)');
    ctx.beginPath(); ctx.arc(food.x*CELL+CELL/2, food.y*CELL+CELL/2, sz*2, 0, Math.PI*2);
    ctx.fillStyle = grd; ctx.fill();
    ctx.beginPath(); ctx.arc(food.x*CELL+CELL/2, food.y*CELL+CELL/2, sz, 0, Math.PI*2);
    ctx.fillStyle = '#ffd54f'; ctx.fill();
    ctx.fillStyle = '#fff9c4';
    ctx.beginPath(); ctx.arc(food.x*CELL+CELL/2-sz*0.3, food.y*CELL+CELL/2-sz*0.3, sz*0.25, 0, Math.PI*2);
    ctx.fill();
  }

  // Power-up
  if (powerup) {
    powerup.blink = (powerup.blink||0) + 0.15;
    const pulse = 0.85 + 0.15*Math.sin(powerup.blink);
    const px = powerup.x*CELL+CELL/2, py = powerup.y*CELL+CELL/2;
    const sz = CELL*0.4*pulse;
    ctx.beginPath(); ctx.arc(px,py,sz+4,0,Math.PI*2);
    ctx.fillStyle = powerup.col+'33'; ctx.fill();
    ctx.beginPath(); ctx.arc(px,py,sz,0,Math.PI*2);
    ctx.fillStyle = powerup.col; ctx.fill();
    ctx.strokeStyle='#fff'; ctx.lineWidth=1.5; ctx.stroke();
    ctx.font=`${CELL*0.5}px sans-serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(powerup.emoji, px, py+1);
  }

  // Snake
  const isGhost = puType==='ghost' && puTimer>0;
  snake.forEach((seg, i) => {
    const t = i/snake.length;
    const headColor = isGhost ? '#80cbc4' : '#4fc3f7';
    const bodyColor = isGhost
      ? `rgba(128,203,196,${0.7-t*0.5})`
      : `rgba(${79+Math.floor(t*50)},${195-Math.floor(t*60)},247,${1-t*0.4})`;

    const pad = i===0 ? 1 : 2 + t*2;
    const x = seg.x*CELL+pad, y = seg.y*CELL+pad;
    const sz = CELL-pad*2;

    ctx.beginPath();
    ctx.roundRect(x, y, sz, sz, i===0?4:3);
    ctx.fillStyle = i===0 ? headColor : bodyColor;
    ctx.fill();

    // Head eyes
    if (i===0) {
      const ex = seg.x*CELL+CELL/2 + dir.x*3;
      const ey = seg.y*CELL+CELL/2 + dir.y*3;
      const perp = {x:-dir.y, y:dir.x};
      [-1,1].forEach(side=>{
        ctx.beginPath();
        ctx.arc(ex+perp.x*4*side, ey+perp.y*4*side, 2.5, 0, Math.PI*2);
        ctx.fillStyle='#000'; ctx.fill();
        ctx.beginPath();
        ctx.arc(ex+perp.x*4*side+0.8, ey+perp.y*4*side-0.8, 1, 0, Math.PI*2);
        ctx.fillStyle='#fff'; ctx.fill();
      });
    }
  });
}

// ── INPUT ─────────────────────────────────────────────────────────
window.addEventListener('keydown', e => {
  const d = DIRS[e.code];
  if (d) {
    e.preventDefault();
    // Prevent 180° reversal
    if (d.x !== -dir.x || d.y !== -dir.y) nextDir = d;
  }
});
</script>
</body>
</html>
